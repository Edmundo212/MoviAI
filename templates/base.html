<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SmartFlow{% endblock %} · AI Adaptive Traffic Signals</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="logo"><i class="r"></i><i class="y"></i><i class="g"></i></span>
      SmartFlow
    </a>
    <span class="tagline">AI-powered adaptive traffic signals · Azure AI Vision · SDG 9</span>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">SmartFlow · WFEO Hackathon 2027 · Challenge 3: Smart, Digital and Data-Driven Transport</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
