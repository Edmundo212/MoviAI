server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    client_max_body_size 200M;

    # Video en vivo (MJPEG): sin buffer para que los fotogramas lleguen al instante
    location ~ ^/live/[^/]+/stream\.mjpg$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
